[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebpf-ransom-lab"
version = "0.1.0"
description = "A reproducible Linux ransomware-behavior detection research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mehdi"}]
dependencies = []

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6,<8"]

[project.scripts]
ransomlab = "ebpf_ransom_lab.cli:main"

[tool.setuptools.package-data]
ebpf_ransom_lab = ["data/*.json"]

[tool.coverage.run]
branch = true
source = ["ebpf_ransom_lab"]
omit = ["src/ebpf_ransom_lab/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["src"]
