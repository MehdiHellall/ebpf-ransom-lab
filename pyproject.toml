[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebpf-ransom-lab"
version = "0.1.0"
description = "A reproducible Linux ransomware-behavior detection research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Mehdi"}]
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "skops>=0.10,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "httpx>=0.27,<1",
    "pytest>=9.0.3,<10",
]
e2e = ["playwright>=1.48,<2"]

[project.scripts]
ransomlab = "ebpf_ransom_lab.cli:main"

[tool.setuptools.package-data]
ebpf_ransom_lab = [
    "data/*.json",
    "collector/*.c",
    "static/*.css",
    "static/*.html",
    "static/*.js",
    "static/*.png",
]

[tool.coverage.run]
branch = true
source = ["ebpf_ransom_lab"]
omit = ["src/ebpf_ransom_lab/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["src"]
