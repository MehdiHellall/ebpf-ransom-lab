name: ubuntu-bcc-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-gate:
    runs-on: [self-hosted, Linux, X64, ebpf-bcc]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Ubuntu 24.04 environment
        run: scripts/bootstrap_ubuntu.sh
      - name: Run portable and live BCC gates
        run: scripts/ubuntu_bcc_gate.sh
